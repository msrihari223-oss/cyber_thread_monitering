<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Cyber Threat Monitoring</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-primary: #080b11;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --shadow-premium: 0 20px 50px rgba(0, 0, 0, 0.6);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(219, 39, 119, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text-primary);
        }

        .reset-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-premium);
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-section h1 {
            font-size: 26px;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            transition: var(--transition-smooth);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            outline: none;
        }

        input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .password-strength {
            margin-top: 10px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: var(--transition-smooth);
        }

        .password-strength.medium .password-strength-bar {
            width: 50%;
            background: #f59e0b;
        }

        .password-strength.strong .password-strength-bar {
            width: 100%;
            background: #10b981;
        }

        .reset-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--brand-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.5);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #result.show {
            display: block;
        }

        #result.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        #result.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .invalid-token {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .invalid-token p {
            margin-bottom: 15px;
            font-weight: 700;
        }

        .invalid-token a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition-smooth);
        }

        .invalid-token a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .auth-link {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 24px;
        }

        .auth-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition-smooth);
        }

        .auth-link a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo-section">
            <h1>🔐 Set New Password</h1>
            <p>Create a strong password</p>
        </div>

        <div id="invalidTokenMessage"></div>

        <div id="resetForm" style="display: none;">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Create a strong password" oninput="checkPasswordStrength()">
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
            </div>

            <button class="reset-btn" onclick="resetPassword()">Save</button>

            <div id="result"></div>

            <div class="auth-link">
                <a href="/">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function getTokenFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        function checkPasswordStrength() {
            const password = document.getElementById("newPassword").value;
            const strengthDiv = document.getElementById("passwordStrength");

            if (password.length < 6) {
                strengthDiv.className = "password-strength";
            } else if (password.length < 10 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
                strengthDiv.className = "password-strength medium";
            } else {
                strengthDiv.className = "password-strength strong";
            }
        }

        function showInvalidToken() {
            const message = document.getElementById("invalidTokenMessage");
            message.innerHTML = `
                <div class="invalid-token">
                    <p>❌ Invalid or Expired Reset Link</p>
                    <p style="font-size: 13px; margin-bottom: 15px;">Your password reset link has expired or is invalid. Please request a new one.</p>
                    <a href="/forgot-password">Request New Reset Link</a>
                </div>
            `;
            document.getElementById("resetForm").style.display = "none";
        }

        async function resetPassword() {
            const token = getTokenFromURL();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const resultDiv = document.getElementById("result");

            if (!token) {
                showInvalidToken();
                return;
            }

            if (!newPassword || !confirmPassword) {
                resultDiv.textContent = "Please fill in all fields";
                resultDiv.className = "show error";
                return;
            }

            if (newPassword !== confirmPassword) {
                resultDiv.textContent = "Passwords do not match";
                resultDiv.className = "show error";
                return;
            }

            if (newPassword.length < 6) {
                resultDiv.textContent = "Password must be at least 6 characters";
                resultDiv.className = "show error";
                return;
            }

            try {
                let response = await fetch("/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    resultDiv.textContent = error.detail || "Password reset failed";
                    resultDiv.className = "show error";
                    return;
                }

                resultDiv.textContent = "✓ Password reset successfully! Redirecting to login...";
                resultDiv.className = "show success";
                setTimeout(() => {
                    window.location.href = "/";
                }, 2000);
            } catch (error) {
                resultDiv.textContent = "Connection error. Please try again.";
                resultDiv.className = "show error";
            }
        }

        window.addEventListener("load", function() {
            const token = getTokenFromURL();
            if (!token) {
                showInvalidToken();
                return;
            }
            document.getElementById("resetForm").style.display = "block";
        });

        document.getElementById("confirmPassword")?.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                resetPassword();
            }
        });
    </script>
</body>
</html>
