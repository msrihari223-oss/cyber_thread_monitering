<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cyber Threat Monitoring</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-primary: #080b11;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --shadow-premium: 0 20px 50px rgba(0, 0, 0, 0.6);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(219, 39, 119, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text-primary);
        }

        .forgot-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-premium);
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: left;
            margin-bottom: 32px;
        }

        .logo-section h1 {
            font-size: 26px;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .info-text {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            transition: var(--transition-smooth);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            outline: none;
        }

        input[type="email"]:focus,
        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--brand-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #result.show {
            display: block;
        }

        #result.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        #result.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .otp-reset-section {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .otp-reset-section.show {
            display: block;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .otp-reset-section h3 {
            color: var(--text-primary);
            font-size: 16px;
            margin-bottom: 18px;
            font-weight: 800;
        }

        .auth-link {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 24px;
        }

        .auth-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition-smooth);
        }

        .auth-link a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="logo-section">
            <h1>🔑 Forgot Password</h1>
            <p>Reset Your Password</p>
            <div class="info-text">
                Enter your email address and we'll send you a link to reset your password.
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="admin@example.com">
        </div>

        <button class="submit-btn" id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>

        <div id="result"></div>

        <div class="otp-reset-section" id="otpResetSection">
            <h3>Enter OTP to verify your reset</h3>

            <div class="form-group">
                <label for="otp">Verification Code</label>
                <input type="text" id="otp" placeholder="Enter the OTP sent to your email">
            </div>

            <button class="submit-btn" id="verifyOtpBtn" onclick="verifyOTP()">Verify OTP</button>
        </div>

        <div class="auth-link">
            <a href="/">Back to Sign In</a>
        </div>
    </div>

    <script>
        let resendTimerId;
        let resendSeconds = 0;

        async function sendOTP() {
            const emailInput = document.getElementById("email");
            const email = emailInput.value.trim();
            const resultDiv = document.getElementById("result");
            const otpSection = document.getElementById("otpResetSection");
            const sendBtn = document.getElementById("sendOtpBtn");

            if (!email) {
                resultDiv.textContent = "Please enter your email address";
                resultDiv.className = "show error";
                otpSection.classList.remove("show");
                return;
            }

            try {
                let response = await fetch(`/forgot-password/otp?email=${encodeURIComponent(email)}`, {
                    method: "GET"
                });

                if (!response.ok) {
                    const error = await response.json();
                    resultDiv.textContent = error.detail || "Failed to send OTP";
                    resultDiv.className = "show error";
                    otpSection.classList.remove("show");
                    return;
                }

                resultDiv.textContent = "✓ OTP sent to your email. Enter the code below to verify.";
                resultDiv.className = "show success";
                otpSection.classList.add("show");
                emailInput.disabled = true;
                startResendCountdown();
            } catch (error) {
                resultDiv.textContent = "Connection error. Please try again.";
                resultDiv.className = "show error";
                otpSection.classList.remove("show");
            }
        }

        function startResendCountdown() {
            const sendBtn = document.getElementById("sendOtpBtn");
            resendSeconds = 60;
            sendBtn.disabled = true;
            sendBtn.textContent = `Resend OTP (${resendSeconds}s)`;

            resendTimerId = setInterval(() => {
                resendSeconds -= 1;
                if (resendSeconds <= 0) {
                    clearInterval(resendTimerId);
                    sendBtn.disabled = false;
                    sendBtn.textContent = "Resend OTP";
                    document.getElementById("email").disabled = false;
                    return;
                }
                sendBtn.textContent = `Resend OTP (${resendSeconds}s)`;
            }, 1000);
        }

        async function verifyOTP() {
            const email = document.getElementById("email").value.trim();
            const otp = document.getElementById("otp").value.trim();
            const resultDiv = document.getElementById("result");

            if (!email || !otp) {
                resultDiv.textContent = "Please enter your email and OTP";
                resultDiv.className = "show error";
                return;
            }

            try {
                let response = await fetch("/verify-otp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email, otp: otp })
                });

                if (!response.ok) {
                    const error = await response.json();
                    resultDiv.textContent = error.detail || "OTP verification failed";
                    resultDiv.className = "show error";
                    return;
                }

                let data = await response.json();
                window.location.href = data.reset_url;
            } catch (error) {
                resultDiv.textContent = "Connection error. Please try again.";
                resultDiv.className = "show error";
            }
        }

        document.getElementById("email").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendOTP();
            }
        });
    </script>
</body>
</html>
