<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call - Cyber Threat Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0f1419;
            color: #fff;
        }

        header {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-bottom: 2px solid #00d4ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .call-duration {
            font-size: 14px;
            color: #00ff88;
            font-weight: bold;
        }

        .call-status {
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .call-status.pending {
            background: rgba(255, 200, 0, 0.2);
            color: #ffc800;
            border-color: #ffc800;
        }

        .call-status.ongoing {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-color: #00ff88;
        }

        .call-status.ended {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border-color: #ff4444;
        }

        main {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-section {
            flex: 1;
            background: #1a1f2e;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #00d4ff;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 10;
        }

        .no-video {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #888;
            gap: 10px;
        }

        .video-icon {
            font-size: 48px;
        }

        .controls {
            display: flex;
            gap: 15px;
            padding: 20px;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #00d4ff;
            color: #000;
        }

        .btn-primary:hover {
            background: #00ffff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-success {
            background: #00ff88;
            color: #000;
        }

        .btn-success:hover {
            background: #00ffbb;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ff4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff6666;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ffc800;
            color: #000;
        }

        .btn-warning:hover {
            background: #ffdd44;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.5);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sidebar {
            width: 300px;
            background: #1a1f2e;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .sidebar-section {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #00d4ff;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
        }

        .settings {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 5px;
            background: rgba(0, 212, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .toggle-switch {
            width: 40px;
            height: 20px;
            background: #555;
            border-radius: 10px;
            position: relative;
            transition: background 0.3s ease;
        }

        .toggle-switch.active {
            background: #00ff88;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s ease;
        }

        .toggle-switch.active::after {
            left: 22px;
        }

        .toggle-label {
            flex: 1;
            font-size: 13px;
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            height: 200px;
            gap: 10px;
        }

        .messages {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }

        .message {
            padding: 8px;
            border-radius: 5px;
            background: rgba(0, 212, 255, 0.1);
            border-left: 2px solid #00d4ff;
        }

        .message.system {
            background: rgba(255, 200, 0, 0.1);
            border-left-color: #ffc800;
            color: #ffc800;
        }

        .message-input-group {
            display: flex;
            gap: 5px;
        }

        .message-input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            background: rgba(0, 212, 255, 0.05);
            color: #fff;
            font-size: 12px;
        }

        .message-input-group input::placeholder {
            color: #666;
        }

        .message-input-group button {
            padding: 8px 12px;
            font-size: 12px;
        }

        .call-setup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 20, 25, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00d4ff;
            z-index: 1000;
            min-width: 400px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .call-setup.active {
            display: flex;
        }

        .setup-title {
            font-size: 20px;
            font-weight: bold;
            color: #00d4ff;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            color: #888;
        }

        .input-group input,
        .input-group select {
            padding: 10px;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            background: rgba(0, 212, 255, 0.05);
            color: #fff;
            font-size: 13px;
        }

        .setup-actions {
            display: flex;
            gap: 10px;
        }

        .setup-actions button {
            flex: 1;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 200px;
            }

            .video-container {
                min-height: 0;
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <header>
            <div class="header-title">
                <span>📹</span>
                <span>Video Call</span>
            </div>
            <div class="header-info">
                <div class="call-duration" id="callDuration">00:00</div>
                <div class="call-status pending" id="callStatus">Initializing...</div>
            </div>
        </header>

        <main>
            <div class="video-container">
                <div class="video-section">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">Your Video</div>
                </div>

                <div class="video-section">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label">Remote Video</div>
                    <div class="no-video" id="noRemoteVideo" style="display: none;">
                        <div class="video-icon">📵</div>
                        <div>Waiting for remote video...</div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-primary" id="toggleAudio" title="Toggle Audio">
                        <span>🎤</span>
                        <span>Audio</span>
                    </button>
                    <button class="btn-primary" id="toggleVideo" title="Toggle Video">
                        <span>📹</span>
                        <span>Video</span>
                    </button>
                    <button class="btn-success" id="acceptCall" style="display: none;">
                        <span>✓</span>
                        <span>Accept</span>
                    </button>
                    <button class="btn-danger" id="endCall" title="End Call">
                        <span>✕</span>
                        <span>End Call</span>
                    </button>
                    <button class="btn-warning" id="shareScreen" title="Share Screen">
                        <span>🖥️</span>
                        <span>Share</span>
                    </button>
                </div>
            </div>

            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">Call Statistics</div>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">Bitrate</span>
                            <span class="stat-value" id="bitrate">0 kbps</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Packet Loss</span>
                            <span class="stat-value" id="packetLoss">0%</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Latency</span>
                            <span class="stat-value" id="latency">0 ms</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Quality</span>
                            <span class="stat-value" id="quality">Good</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">Settings</div>
                    <div class="settings">
                        <label class="toggle">
                            <span class="toggle-label">Speakers</span>
                            <div class="toggle-switch active" id="speakersToggle"></div>
                        </label>
                        <label class="toggle">
                            <span class="toggle-label">Microphone</span>
                            <div class="toggle-switch active" id="micToggle"></div>
                        </label>
                        <label class="toggle">
                            <span class="toggle-label">Noise Cancellation</span>
                            <div class="toggle-switch" id="noiseCancelToggle"></div>
                        </label>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">Chat</div>
                    <div class="chat-box">
                        <div class="messages" id="chatMessages">
                            <div class="message system">Call connected</div>
                        </div>
                        <div class="message-input-group">
                            <input type="text" id="chatInput" placeholder="Type message...">
                            <button class="btn-primary" id="sendMessage" style="padding: 8px 12px;">Send</button>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <div class="call-setup active" id="callSetup">
        <div class="setup-title">Initiate Video Call</div>
        <div class="input-group">
            <label>Your User ID</label>
            <input type="number" id="callerId" placeholder="Enter your user ID" value="1">
        </div>
        <div class="input-group">
            <label>Recipient User ID</label>
            <input type="number" id="calleeId" placeholder="Enter recipient user ID" value="2">
        </div>
        <div class="setup-actions">
            <button class="btn-success" id="initiateButton">Start Call</button>
            <button class="btn-danger" id="cancelButton">Cancel</button>
        </div>
    </div>

    <script>
        // ==================== Configuration ====================
        const CONFIG = {
            iceServers: [
                { urls: ['stun:stun.l.google.com:19302'] },
                { urls: ['stun:stun1.l.google.com:19302'] },
                { urls: ['stun:stun2.google.com:19302'] },
                { urls: ['stun:stun3.google.com:19302'] },
            ]
        };

        // ==================== State Variables ====================
        let state = {
            callId: null,
            userId: null,
            remoteUserId: null,
            peerConnection: null,
            localStream: null,
            remoteStream: null,
            websocket: null,
            audioEnabled: true,
            videoEnabled: true,
            callStartTime: null,
            callDuration: 0,
            durationInterval: null,
            statsInterval: null,
            isInitiator: true
        };

        // ==================== DOM Elements ====================
        const elements = {
            localVideo: document.getElementById('localVideo'),
            remoteVideo: document.getElementById('remoteVideo'),
            noRemoteVideo: document.getElementById('noRemoteVideo'),
            callDuration: document.getElementById('callDuration'),
            callStatus: document.getElementById('callStatus'),
            toggleAudio: document.getElementById('toggleAudio'),
            toggleVideo: document.getElementById('toggleVideo'),
            acceptCall: document.getElementById('acceptCall'),
            endCall: document.getElementById('endCall'),
            shareScreen: document.getElementById('shareScreen'),
            bitrate: document.getElementById('bitrate'),
            packetLoss: document.getElementById('packetLoss'),
            latency: document.getElementById('latency'),
            quality: document.getElementById('quality'),
            speakersToggle: document.getElementById('speakersToggle'),
            micToggle: document.getElementById('micToggle'),
            noiseCancelToggle: document.getElementById('noiseCancelToggle'),
            chatMessages: document.getElementById('chatMessages'),
            chatInput: document.getElementById('chatInput'),
            sendMessage: document.getElementById('sendMessage'),
            callSetup: document.getElementById('callSetup'),
            overlay: document.getElementById('overlay'),
            callerId: document.getElementById('callerId'),
            calleeId: document.getElementById('calleeId'),
            initiateButton: document.getElementById('initiateButton'),
            cancelButton: document.getElementById('cancelButton')
        };

        // ==================== Event Listeners ====================
        elements.initiateButton.addEventListener('click', initiateCall);
        elements.cancelButton.addEventListener('click', () => {
            state.userId = parseInt(elements.callerId.value);
            state.remoteUserId = parseInt(elements.calleeId.value);
            elements.callSetup.classList.remove('active');
            elements.overlay.classList.remove('active');
        });

        elements.toggleAudio.addEventListener('click', toggleAudio);
        elements.toggleVideo.addEventListener('click', toggleVideo);
        elements.acceptCall.addEventListener('click', acceptCall);
        elements.endCall.addEventListener('click', endCall);
        elements.shareScreen.addEventListener('click', shareScreen);
        elements.sendMessage.addEventListener('click', sendChatMessage);
        elements.chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        // ==================== Main Functions ====================
        async function initiateCall() {
            state.userId = parseInt(elements.callerId.value);
            state.remoteUserId = parseInt(elements.calleeId.value);

            if (!state.userId || !state.remoteUserId) {
                alert('Please enter both user IDs');
                return;
            }

            try {
                elements.initiateButton.disabled = true;
                elements.initiateButton.textContent = 'Initiating...';

                // Request call from server
                const response = await fetch('/api/initiate-call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        caller_id: state.userId,
                        callee_id: state.remoteUserId
                    })
                });

                if (!response.ok) throw new Error('Failed to initiate call');
                const data = await response.json();
                state.callId = data.call_id;

                // Hide setup and show call interface
                elements.callSetup.classList.remove('active');
                elements.overlay.classList.remove('active');

                // Initialize call
                await initializeCall(true);
            } catch (error) {
                console.error('Error initiating call:', error);
                alert('Failed to initiate call: ' + error.message);
                elements.initiateButton.disabled = false;
                elements.initiateButton.textContent = 'Start Call';
            }
        }

        async function initializeCall(isInitiator) {
            try {
                // Get local stream
                state.localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } }
                });

                elements.localVideo.srcObject = state.localStream;

                // Create peer connection
                const iceServers = CONFIG.iceServers;
                state.peerConnection = new RTCPeerConnection({ iceServers });

                // Add tracks to peer connection
                state.localStream.getTracks().forEach(track => {
                    state.peerConnection.addTrack(track, state.localStream);
                });

                // Handle ICE candidates
                state.peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendSignalingMessage({
                            type: 'ice_candidate',
                            candidate: event.candidate
                        });
                    }
                };

                // Handle remote stream
                state.peerConnection.ontrack = (event) => {
                    console.log('Remote track received:', event.track);
                    elements.remoteVideo.srcObject = event.streams[0];
                    elements.noRemoteVideo.style.display = 'none';
                };

                // Handle connection state changes
                state.peerConnection.onconnectionstatechange = () => {
                    console.log('Connection state:', state.peerConnection.connectionState);
                    updateCallStatus(state.peerConnection.connectionState);
                };

                // Connect WebSocket
                await connectWebSocket();

                if (isInitiator) {
                    // Create and send offer
                    const offer = await state.peerConnection.createOffer();
                    await state.peerConnection.setLocalDescription(offer);
                    sendSignalingMessage({
                        type: 'offer',
                        sdp: offer.sdp
                    });
                } else {
                    elements.acceptCall.style.display = 'flex';
                }

                // Start call timer
                startCallTimer();

                // Start stats monitoring
                startStatsMonitoring();

            } catch (error) {
                console.error('Error initializing call:', error);
                alert('Error accessing media devices: ' + error.message);
            }
        }

        async function connectWebSocket() {
            return new Promise((resolve, reject) => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws/video-call/${state.callId}/${state.userId}`;

                state.websocket = new WebSocket(wsUrl);

                state.websocket.onopen = () => {
                    console.log('WebSocket connected');
                    resolve();
                };

                state.websocket.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    await handleSignalingMessage(data);
                };

                state.websocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    reject(error);
                };

                state.websocket.onclose = () => {
                    console.log('WebSocket disconnected');
                };
            });
        }

        async function handleSignalingMessage(data) {
            try {
                if (data.type === 'offer') {
                    await state.peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
                    const answer = await state.peerConnection.createAnswer();
                    await state.peerConnection.setLocalDescription(answer);
                    sendSignalingMessage({
                        type: 'answer',
                        sdp: answer.sdp
                    });
                } else if (data.type === 'answer') {
                    await state.peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                } else if (data.type === 'ice_candidate') {
                    const candidate = data.candidate;
                    if (candidate) {
                        await state.peerConnection.addIceCandidate(candidate);
                    }
                }
            } catch (error) {
                console.error('Error handling signaling message:', error);
            }
        }

        function sendSignalingMessage(message) {
            if (state.websocket && state.websocket.readyState === WebSocket.OPEN) {
                state.websocket.send(JSON.stringify(message));
            }
        }

        async function acceptCall() {
            try {
                await fetch(`/api/accept-call/${state.callId}`, { method: 'POST' });
                elements.acceptCall.style.display = 'none';
                updateCallStatus('ongoing');
            } catch (error) {
                console.error('Error accepting call:', error);
            }
        }

        async function endCall() {
            try {
                // Close peer connection
                if (state.peerConnection) {
                    state.peerConnection.close();
                }

                // Close WebSocket
                if (state.websocket) {
                    state.websocket.close();
                }

                // Stop local stream
                if (state.localStream) {
                    state.localStream.getTracks().forEach(track => track.stop());
                }

                // Stop timers
                if (state.durationInterval) clearInterval(state.durationInterval);
                if (state.statsInterval) clearInterval(state.statsInterval);

                // Notify server
                await fetch(`/api/reject-call/${state.callId}`, { method: 'POST' });

                // Reset UI
                elements.callSetup.classList.add('active');
                elements.overlay.classList.add('active');
                updateCallStatus('ended');
            } catch (error) {
                console.error('Error ending call:', error);
            }
        }

        function toggleAudio() {
            if (state.localStream) {
                state.audioEnabled = !state.audioEnabled;
                state.localStream.getAudioTracks().forEach(track => {
                    track.enabled = state.audioEnabled;
                });
                elements.toggleAudio.style.opacity = state.audioEnabled ? '1' : '0.5';
            }
        }

        function toggleVideo() {
            if (state.localStream) {
                state.videoEnabled = !state.videoEnabled;
                state.localStream.getVideoTracks().forEach(track => {
                    track.enabled = state.videoEnabled;
                });
                elements.toggleVideo.style.opacity = state.videoEnabled ? '1' : '0.5';
            }
        }

        async function shareScreen() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: 'always' },
                    audio: false
                });

                const screenTrack = screenStream.getVideoTracks()[0];
                const sender = state.peerConnection.getSenders().find(s => s.track?.kind === 'video');

                if (sender) {
                    await sender.replaceTrack(screenTrack);
                    elements.localVideo.srcObject = screenStream;

                    screenTrack.onended = async () => {
                        const videoTrack = state.localStream.getVideoTracks()[0];
                        await sender.replaceTrack(videoTrack);
                        elements.localVideo.srcObject = state.localStream;
                    };
                }
            } catch (error) {
                console.error('Error sharing screen:', error);
            }
        }

        function sendChatMessage() {
            const message = elements.chatInput.value.trim();
            if (!message) return;

            // Add to local chat
            addChatMessage('You', message);
            elements.chatInput.value = '';

            // Send via WebSocket
            sendSignalingMessage({
                type: 'chat_message',
                message: message
            });
        }

        function addChatMessage(sender, message) {
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            msgEl.textContent = `${sender}: ${message}`;
            elements.chatMessages.appendChild(msgEl);
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        function startCallTimer() {
            state.callStartTime = Date.now();
            state.durationInterval = setInterval(() => {
                const duration = Math.floor((Date.now() - state.callStartTime) / 1000);
                const minutes = Math.floor(duration / 60);
                const seconds = duration % 60;
                elements.callDuration.textContent =
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        async function startStatsMonitoring() {
            state.statsInterval = setInterval(async () => {
                if (!state.peerConnection) return;

                try {
                    const stats = await state.peerConnection.getStats();
                    let inboundRtp, outboundRtp;

                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.mediaType === 'video') {
                            inboundRtp = report;
                        } else if (report.type === 'outbound-rtp' && report.mediaType === 'video') {
                            outboundRtp = report;
                        }
                    });

                    if (inboundRtp) {
                        const bitrate = (inboundRtp.bytesReceived * 8 / 1000000).toFixed(2);
                        const packetLoss = inboundRtp.packetsLost || 0;
                        elements.bitrate.textContent = `${bitrate} Mbps`;
                        elements.packetLoss.textContent = `${packetLoss}`;
                    }

                    // Estimate quality
                    const quality = estimateQuality(inboundRtp, outboundRtp);
                    elements.quality.textContent = quality;
                } catch (error) {
                    console.error('Error getting stats:', error);
                }
            }, 1000);
        }

        function estimateQuality(inbound, outbound) {
            if (!inbound) return 'Unknown';
            const loss = inbound.packetsLost || 0;
            if (loss === 0) return 'Excellent';
            if (loss < 5) return 'Good';
            if (loss < 15) return 'Fair';
            return 'Poor';
        }

        function updateCallStatus(status) {
            elements.callStatus.className = `call-status ${status}`;
            elements.callStatus.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        // Auto-initialize call if parameters are present in URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const caller = urlParams.get('caller');
            const callee = urlParams.get('callee');
            if (caller && callee) {
                elements.callerId.value = caller;
                elements.calleeId.value = callee;
                setTimeout(() => {
                    initiateCall();
                }, 800);
            }
        });
    </script>
</body>

</html>
