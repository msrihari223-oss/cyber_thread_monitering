<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat Monitoring - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-primary: #080b11;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --shadow-premium: 0 20px 50px rgba(0, 0, 0, 0.6);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(219, 39, 119, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text-primary);
        }

        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-premium);
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-section h1 {
            font-size: 26px;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            transition: var(--transition-smooth);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .login-btn,
        .signup-btn {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .login-btn {
            background: var(--brand-gradient);
            color: white;
            border: none;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .signup-btn {
            background: transparent;
            color: var(--text-primary);
            border: 1.5px solid rgba(124, 58, 237, 0.6);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.1);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            background: rgba(124, 58, 237, 0.12);
            border-color: rgba(124, 58, 237, 0.9);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.25);
            color: white;
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #result.show {
            display: block;
        }

        #result.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        #result.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .auth-links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .auth-link {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition-smooth);
        }

        .auth-link a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .demo-info {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .demo-info strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>🛡️ Cyber Threat Monitoring</h1>
            <p>AI-Powered Security Analysis</p>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <div class="btn-row">
            <button class="login-btn" id="signin-btn" onclick="login()">Sign In</button>
            <a href="/signup" class="signup-btn" id="signup-btn">Sign Up</a>
        </div>

        <div id="result"></div>

        <div class="auth-link">
            Don't have an account? <a href="/signup">Create one here</a>
        </div>

        <div class="auth-link">
            <a href="/forgot-password">Forgot your password?</a>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const resultDiv = document.getElementById("result");

            if (!email || !password) {
                resultDiv.textContent = "Please enter both email and password";
                resultDiv.className = "show error";
                return;
            }

            try {
                let response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    if (response.status === 403 && error.detail && error.detail.toLowerCase().includes("blocked")) {
                        resultDiv.textContent = "Your account has been blocked due to policy violation. Please contact support.";
                        resultDiv.className = "show error";
                        return;
                    }
                    resultDiv.textContent = error.detail || "Login failed";
                    resultDiv.className = "show error";
                    return;
                }

                let data = await response.json();
                localStorage.setItem("token", data.access_token);
                localStorage.setItem("user_id", data.user_id);
                localStorage.setItem("user_role", data.role || "User");
                localStorage.setItem("user_email", email);
                resultDiv.textContent = "✓ Login successful. Redirecting...";
                resultDiv.className = "show success";
                setTimeout(() => {
                    window.location.href = "/dashboard";
                }, 1500);
            } catch (error) {
                resultDiv.textContent = "Connection error. Please try again.";
                resultDiv.className = "show error";
            }
        }

        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>
</body>
</html>
